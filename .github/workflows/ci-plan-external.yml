name: Diagnostic external workflow planning
on:
  pull_request:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'External workflow graph loaded; this is not a release check.'
  scan:
    if: false
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      fail-on-vuln: false
