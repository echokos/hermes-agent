name: Diagnostic local workflow planning
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Local workflow graph loaded; this is not a release check.'
  tests:
    if: false
    uses: ./.github/workflows/tests.yml
  tests-os:
    if: false
    uses: ./.github/workflows/tests-os.yml
  lint:
    if: false
    uses: ./.github/workflows/lint.yml
    with:
      event_name: pull_request
  js-tests:
    if: false
    uses: ./.github/workflows/js-tests.yml
  installer-tests:
    if: false
    uses: ./.github/workflows/installer-tests.yml
  e2e-desktop:
    if: false
    uses: ./.github/workflows/e2e-desktop.yml
  docs-site:
    if: false
    uses: ./.github/workflows/docs-site-checks.yml
  history-check:
    if: false
    uses: ./.github/workflows/history-check.yml
  contributor-check:
    if: false
    uses: ./.github/workflows/contributor-check.yml
  uv-lockfile:
    if: false
    uses: ./.github/workflows/uv-lockfile-check.yml
  infographic-check:
    if: false
    uses: ./.github/workflows/infographic-check.yml
  lockfile-diff:
    if: false
    uses: ./.github/workflows/lockfile-diff.yml
  docker-lint:
    if: false
    uses: ./.github/workflows/docker-lint.yml
  supply-chain:
    if: false
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: pull_request
      scan: true
      deps: true
  review-labels:
    if: false
    uses: ./.github/workflows/review-labels.yml
    with:
      ci_review: false
      ci_review_files: ''
      mcp_catalog: false
      supply_chain: false
